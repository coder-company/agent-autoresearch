[package]
name = "autoresearch"
version = "0.1.0"
edition = "2021"
description = "Autonomous goal-directed iteration engine for coding agents"
license = "MIT"
repository = "https://github.com/coder-company/agent-autoresearch"
authors = ["Coder Company"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
thiserror = "2"
anyhow = "1"
git2 = "0.19"
regex = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "autoresearch"
path = "src/main.rs"
