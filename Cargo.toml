[package]
name = "autoresearch"
version = "0.1.2"
edition = "2021"
build = "build.rs"
description = "Autonomous goal-directed iteration loop for Claude Code, Codex CLI, OpenCode, and Pi. Modify, verify, keep, discard, repeat."
license = "GPL-2.0-only"
repository = "https://github.com/coder-company/agent-autoresearch"
homepage = "https://autoresearch.coder.company"
documentation = "https://autoresearch.coder.company"
readme = "README.md"
keywords = ["claude-code", "codex", "agent", "automation", "iteration"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Coder Company"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
thiserror = "2"
anyhow = "1"
git2 = "0.19"
regex = "1"
futures-util = "0.3"
tokio-tungstenite = "0.29"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bin]]
name = "autoresearch"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
