name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "book.toml"
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-cloudflare
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: [self-hosted, coder-company]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          if ! command -v mdbook >/dev/null 2>&1; then
            cargo install mdbook --locked
          fi

      - name: Build docs site
        run: mdbook build

      - name: Generate sitemap and robots
        run: |
          python3 - <<'PY'
          import os
          base = 'https://autoresearch.coder.company/'
          pages = []
          for root, _, files in os.walk('book'):
              for f in files:
                  if f.endswith('.html') and not f.startswith('404'):
                      p = os.path.relpath(os.path.join(root, f), 'book').replace(os.sep, '/')
                      pages.append(p)
          pages.sort()
          with open('book/sitemap.xml', 'w') as fh:
              fh.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              fh.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')
              for p in pages:
                  url = base if p == 'index.html' else base + p
                  fh.write(f'  <url><loc>{url}</loc></url>\n')
              fh.write('</urlset>\n')
          with open('book/robots.txt', 'w') as fh:
              fh.write('User-agent: *\nAllow: /\nSitemap: ' + base + 'sitemap.xml\n')
          PY

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy book \
            --project-name=autoresearch-coder \
            --branch=main \
            --commit-dirty=true
