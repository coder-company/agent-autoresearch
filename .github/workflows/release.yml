name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: [self-hosted, palantir-actions]
            target: x86_64-unknown-linux-gnu
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - label: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Isolate Rust toolchains
        shell: bash
        run: |
          root="$RUNNER_TEMP/autoresearch-${GITHUB_RUN_ID}-${{ matrix.label }}"
          echo "CARGO_HOME=$root/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$root/rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="autoresearch"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            binary="autoresearch.exe"
          fi

          ref_name="${GITHUB_REF_NAME//\//-}"
          package="autoresearch-${ref_name}-${{ matrix.target }}"
          staging="dist/$package"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/$binary" "$staging/$binary"
          cp README.md LICENSE "$staging/"

          archive="dist/$package.tar.gz"
          tar -czf "$archive" -C dist "$package"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autoresearch-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, palantir-actions]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "$TAG"
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
