name: Autoresearch
description: Run an Autoresearch exec loop in GitHub Actions

inputs:
  goal:
    description: Goal to optimize
    required: true
  scope:
    description: JSON array of scope globs
    required: true
  metric:
    description: Metric description
    required: true
  verify:
    description: Verification command
    required: true
  direction:
    description: Metric direction, higher or lower
    required: false
    default: lower
  iterations:
    description: Maximum Autoresearch iterations
    required: false
    default: "3"
  guard:
    description: Optional guard command
    required: false
    default: ""
  cwd:
    description: Repository directory to run in
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Build Autoresearch
      shell: bash
      run: cargo build --locked --manifest-path "$GITHUB_ACTION_PATH/../../Cargo.toml" --release

    - name: Run Autoresearch
      shell: bash
      env:
        AUTORESEARCH_BIN: ${{ github.action_path }}/../../target/release/autoresearch
        INPUT_GOAL: ${{ inputs.goal }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_METRIC: ${{ inputs.metric }}
        INPUT_VERIFY: ${{ inputs.verify }}
        INPUT_DIRECTION: ${{ inputs.direction }}
        INPUT_ITERATIONS: ${{ inputs.iterations }}
        INPUT_GUARD: ${{ inputs.guard }}
        INPUT_CWD: ${{ inputs.cwd }}
      run: |
        set -euo pipefail
        config="$(mktemp)"
        python3 - "$config" <<'PY'
        import json
        import os
        import sys

        scope = json.loads(os.environ["INPUT_SCOPE"])
        config = {
            "goal": os.environ["INPUT_GOAL"],
            "scope": scope,
            "metric": os.environ["INPUT_METRIC"],
            "direction": os.environ["INPUT_DIRECTION"],
            "verify": os.environ["INPUT_VERIFY"],
        }
        guard = os.environ.get("INPUT_GUARD", "").strip()
        if guard:
            config["guard"] = guard
        with open(sys.argv[1], "w", encoding="utf-8") as handle:
            json.dump(config, handle)
        PY
        "$AUTORESEARCH_BIN" exec --iterations "$INPUT_ITERATIONS" --cwd "$INPUT_CWD" < "$config"
